server.port=${PORT:8080}

# CORS (comma-separated). Configure in Render:
# APP_CORS_ALLOWED_ORIGINS=https://consultas.dadtvplay.com
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.email.allowed-domains=${APP_EMAIL_ALLOWED_DOMAINS:dadtvplay.com,gmail.com}

# IMAP defaults. Credentials only through environment variables.
imap.host=${IMAP_HOST:}
imap.port=${IMAP_PORT:993}
imap.username=${IMAP_USERNAME:}
imap.password=${IMAP_PASSWORD:}
imap.folder=${IMAP_FOLDER:INBOX}

# For IMAPS servers using self-signed certificates or a CA not present in the JRE:
# - empty => use the host
# - "*" => trust any host (less secure)
imap.ssl.trust=${IMAP_SSL_TRUST:}

# How many recent emails to scan if the IMAP server search returns no matches
imap.scan.max=${IMAP_SCAN_MAX:500}
